# PostgreSQL for running the application locally.
# Started automatically by Spring Boot (spring-boot-docker-compose) when RestaurantApplication starts,
# or manually with: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: restaurant-postgres
    environment:
      POSTGRES_DB: restaurant
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: restaurant
    ports:
      - "5432:5432"
    volumes:
      - restaurant-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant -d restaurant"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  restaurant-data:
