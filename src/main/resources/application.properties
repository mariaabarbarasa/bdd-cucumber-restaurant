spring.application.name=bdd-cucumber-restaurant
server.port=8080

# PostgreSQL from compose.yaml. When the app starts, Spring Boot runs "docker compose up"
# for compose.yaml (the container keeps running after the app stops, so the data is kept).
spring.datasource.url=jdbc:postgresql://localhost:5432/restaurant
spring.datasource.username=restaurant
spring.datasource.password=restaurant
spring.docker.compose.lifecycle-management=start-only

# The schema is created by Flyway (db/migration); db/seed adds demo data for the running application.
# Hibernate only checks that the entities match the tables.
spring.flyway.locations=classpath:db/migration,classpath:db/seed
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
logging.level.root=WARN
